[alembic]
script_location = alembic
prepend_sys_path = .
# Deliberately blank. alembic/env.py calls
#   config.set_main_option("sqlalchemy.url", settings.sqlalchemy_database_uri)
# before any migration runs, so the real URL always comes from the environment.
# A literal URL here would be dead configuration that still looks authoritative
# — and it previously carried a password into version control.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Development edge configuration.
#
# Routed by port rather than by hostname, so it works at http://localhost with
# no DNS or /etc/hosts entries:
#
#   http://localhost        → customer web app
#   http://localhost:8081   → admin panel
#   http://localhost/api/   → the API, on both ports
#
# Serving the API from the same origin as each SPA is deliberate: the browser
# then makes same-origin requests, so BACKEND_CORS_ORIGINS is not exercised in
# dev at all and cannot mask a misconfiguration. It also means the frontends can
# be built with VITE_API_BASE_URL=/api, which is what the compose files do.
#
# No TLS here. The prod configuration is the one that terminates it.

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/api-proxy.conf;

    location / {
        proxy_pass http://frontend-customer:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 8081;
    server_name _;

    include /etc/nginx/snippets/api-proxy.conf;

    location / {
        proxy_pass http://frontend-admin:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

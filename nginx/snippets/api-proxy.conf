# Shared API proxy rules, included by both the dev and prod server blocks so
# the two cannot drift. In particular the SSE settings below are the ones that
# are easy to get right in dev and silently wrong in production.

# --- streaming chat: owner AI Manager and customer assistant -----------------
#
# Both endpoints emit server-sent events. Three settings decide whether that
# works at all:
#
#   proxy_buffering off   — with buffering on (the default) nginx holds the
#                           whole response and releases it at once, so the user
#                           sees nothing for the full generation and then the
#                           entire answer at once. The stream still "works",
#                           which is why this is missed until someone watches
#                           it. The backend already sends X-Accel-Buffering: no
#                           (app/api/insights.py), which nginx honours, but the
#                           explicit directive is kept so the behaviour does not
#                           depend on a header the app could stop sending.
#   proxy_read_timeout    — must exceed AI_MANAGER_CHAT_ANSWER_TIMEOUT_SECONDS
#                           (110s by default). nginx's 60s default cuts the
#                           connection mid-answer, and the client sees a network
#                           error rather than the deterministic fallback the
#                           backend was about to send. 180s leaves headroom for
#                           the planner call that can precede the answer.
#   HTTP/1.1 + empty Connection — SSE needs a persistent connection upstream;
#                           the default HTTP/1.0 to upstreams closes it.
location ~ ^/api/(owner/insights/chat/message/stream|chat/message/stream)$ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    proxy_connect_timeout 10s;
}

# --- everything else on the API ---------------------------------------------
location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Non-streaming requests can still be slow: a non-streamed owner chat answer
    # blocks for up to the same 110s answer timeout.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    proxy_connect_timeout 10s;
}

# Liveness probe passthrough, so an external monitor can reach the API's own
# health endpoint without going through /api.
location = /health {
    proxy_pass http://api_upstream/health;
    access_log off;
}

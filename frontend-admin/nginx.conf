# Static serving for the admin SPA.
#
# This container serves files only. It never proxies to the API — the edge proxy
# in front of it owns that, so this image has no knowledge of where the backend
# lives and needs no rebuild when the backend moves.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell. It carries the hashed asset filenames, so a stale
    # index.html points at bundles that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Vite emits content-hashed filenames under /assets, so these are safe to
    # cache indefinitely — a changed file gets a changed name.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA history fallback. App.tsx routes with window.history.pushState, so a
    # refresh on /orders asks nginx for a file that does not exist; without this
    # the owner gets a 404 instead of the page they were looking at.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

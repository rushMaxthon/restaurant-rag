# Edge proxy — base configuration.
#
# Per-environment server blocks live in conf.d, which compose mounts from either
# nginx/conf.d/dev or nginx/conf.d/prod. Everything shared sits here.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # The owner chat answer can be large-ish JSON and uploads are small; 10m is
    # generous for both without inviting abuse.
    client_max_body_size 10m;

    # Do not advertise the version in Server: headers or error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    # Deliberately NOT gzipping text/event-stream: compression buffers, which is
    # exactly what the streaming endpoint must not do.

    # Shared proxy headers, so every server block forwards the real client
    # identity. Without X-Forwarded-Proto the app cannot tell it is behind TLS.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    include /etc/nginx/conf.d/*.conf;
}
